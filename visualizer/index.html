<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeetCode 150 - DSA Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>DSA Visualizer</h1>
            <div class="controls">
                <select id="scene-selector">
                    <option value="">-- Select Visualization --</option>
                    <option value="contains-duplicate">Arrays & Hashing: Contains Duplicate</option>
                    <option value="valid-anagram">Arrays & Hashing: Valid Anagram</option>
                    <option value="two-sum">Arrays & Hashing: Two Sum</option>
                    <option value="two-pointers">Two Pointers: Valid Palindrome</option>
                    <option value="sliding-window">Sliding Window: Max Substring</option>
                </select>
                <button id="btn-prev">Previous Step</button>
                <button id="btn-play">Play</button>
                <button id="btn-next">Next Step</button>
                <button id="btn-reset">Reset</button>
                <span id="step-counter">Step: 0 / 0</span>
            </div>
        </header>

        <main>
            <canvas id="main-canvas"></canvas>
            <div id="explanation-panel">
                <h3>Explanation</h3>
                <p id="explanation-text">Select a visualization to begin.</p>
                <div id="complexity-info">
                    <h4>Complexity</h4>
                    <p>Time: <span id="time-complexity">-</span></p>
                    <p>Space: <span id="space-complexity">-</span></p>
                </div>
            </div>
        </main>

        <footer>
            <div id="legend">
                <span class="legend-item"><span class="color-box read"></span> Read</span>
                <span class="legend-item"><span class="color-box write"></span> Write</span>
                <span class="legend-item"><span class="color-box compare"></span> Compare</span>
                <span class="legend-item"><span class="color-box found"></span> Found</span>
                <span class="legend-item"><span class="color-box current"></span> Current</span>
            </div>
        </footer>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/drawings/arrays.js"></script>
    <script src="js/drawings/hashmap.js"></script>
    <script src="js/drawings/pointers.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
